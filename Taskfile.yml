version: '3'

vars:
  BUILD_TYPE: '{{.BUILD_TYPE | default "Debug"}}'
  PROFILE: 'profiles/clang'
  BUILD_DIR: 'build/{{.BUILD_TYPE}}'

tasks:
  venv:
    desc: Создать .venv и установить Conan
    status:
      - test -x .venv/bin/conan
    cmds:
      - python3 -m venv .venv
      - .venv/bin/pip install --upgrade pip -r requirements.txt

  deps:
    desc: Установить зависимости через Conan
    deps: [venv]
    cmds:
      - .venv/bin/conan install . --profile={{.PROFILE}} -s build_type={{.BUILD_TYPE}} --build=missing

  configure:
    desc: Сконфигурировать CMake
    deps: [deps]
    status:
      - test -f {{.BUILD_DIR}}/build.ninja
    cmds:
      - cmake --preset conan-{{lower .BUILD_TYPE}}

  build:
    desc: Собрать проект
    deps: [configure]
    cmds:
      - cmake --build --preset conan-{{lower .BUILD_TYPE}} -j

  test:
    desc: Прогнать юнит-тесты
    deps: [build]
    cmds:
      - ctest --preset conan-{{lower .BUILD_TYPE}} --output-on-failure

  format:
    desc: Прогнать clang-format по исходникам
    cmds:
      - find src tests \( -name '*.hpp' -o -name '*.cpp' \) -exec clang-format -i {} +

  clean:
    desc: Удалить директории сборки и кэш task
    cmds:
      - rm -rf build output CMakeUserPresets.json .task